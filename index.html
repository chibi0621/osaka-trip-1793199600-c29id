<style>
:root{
  --bg:#FFF4F7; --card:#FFFFFF; --ink:#4B3740; --ink2:#8A6C78; --line:#F2D3DE;
  --accent:#F27BA0; --accent2:#9BC8F2; --soft:#FFE6EE; --land:#FFF9FB; --water:#DCEFFC;
  --path:#F27BA0; --walked:#D9467A; --chip:#FFF0F5; --night:#5B4BC4;
  --banner:url("img/banner-pink.jpg");
}
:root[data-theme="lilac"]{
  --bg:#F6F2FC; --ink:#3F3752; --ink2:#7A6E93; --line:#E2D8F2;
  --accent:#A788D8; --accent2:#F4A9C4; --soft:#EEE6FA; --land:#FCFAFF; --water:#E2F0FB;
  --path:#A788D8; --walked:#7B57BF; --chip:#F3EEFB;
  --banner:url("img/banner-lilac.jpg");
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.hero{position:relative;border-radius:22px;overflow:hidden;background:var(--banner) center 38%/cover no-repeat,var(--soft);aspect-ratio:2/1;width:100%;box-shadow:0 6px 0 var(--line)}
@media (max-width:700px){header.hero{aspect-ratio:16/11;background-position:center 30%}}
.hero .tag{position:absolute;left:14px;bottom:14px;right:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:space-between}
.hero h1{margin:0;font-size:clamp(20px,4.2vw,34px);font-weight:900;background:rgba(255,255,255,.9);border-radius:14px;padding:4px 14px;letter-spacing:1px}
.hero .sub{background:rgba(255,255,255,.9);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.btn{font:inherit;font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:40px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.day:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
nav.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;padding:8px 2px 10px}
@media (max-width:520px){nav.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
.day{min-width:0;font:inherit;border:2px dashed var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px 6px 8px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center}
.day img{height:40px;width:40px;object-fit:contain}
.day b{display:block;font-size:14.5px;line-height:1.35}
.day span{display:block;font-size:12px;color:var(--ink2);line-height:1.35}
.day[aria-selected="true"]{border-style:solid;border-color:var(--accent);background:var(--soft)}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}

.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px}
.daytitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin:0 0 8px}
.daytitle h2{margin:0;font-size:20px;font-weight:900}
.daytitle span{color:var(--ink2);font-size:13px;font-weight:700}
svg#map{width:100%;height:auto;display:block;border-radius:16px;background:var(--land)}
.pin circle.dot{fill:#fff;stroke:var(--accent);stroke-width:3}
.pin.done circle.dot{fill:var(--soft)}
.pin.now circle.dot{fill:var(--accent);stroke:#fff}
.lbl{font-size:23px;font-weight:900;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
.pin .emo{font-size:22px}
.pin.now .ring{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}
.seg-base{fill:none;stroke:var(--path);stroke-width:4;stroke-linecap:round;stroke-dasharray:2 9;opacity:.45}
.seg-walk{fill:none;stroke:var(--walked);stroke-width:5;stroke-linecap:round}
.seg-lbl{font-size:19px;font-weight:700;fill:var(--ink2);paint-order:stroke;stroke:#fff;stroke-width:5px}
.controls{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.clock{font-size:26px;font-weight:900;min-width:76px;font-variant-numeric:tabular-nums}
.controls input[type=range]{flex:1;min-width:150px;accent-color:var(--accent);height:32px}
.round{width:44px;height:44px;border-radius:50%;padding:0;font-size:16px}
.status{margin-top:8px;background:var(--chip);border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px;min-height:52px;display:flex;align-items:center;gap:10px}
.status img{height:44px;width:44px;object-fit:contain;flex:none}
ol.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{border:2px solid var(--line);border-radius:18px;padding:10px 12px;background:#fff;transition:background .3s,border-color .3s;cursor:pointer}
.stop.now{border-color:var(--accent);background:var(--soft)}
.stop.done{opacity:.62}
.stop .top{display:flex;gap:10px;align-items:baseline}
.stop .t{font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent);min-width:46px}
.stop .n{font-weight:900;font-size:15.5px}
.stop .go{margin:6px 0 0 56px;font-size:13px;background:var(--chip);border-radius:10px;padding:5px 9px}
.stop .go b{color:var(--walked)}
.stop .meta{margin:6px 0 0 56px;font-size:12.5px;color:var(--ink2)}
.mlink{font-weight:700;color:var(--walked);text-decoration:none;border-bottom:1.5px dotted currentColor;white-space:nowrap}
.note{font-size:12.5px;color:var(--ink2);margin:10px 4px 0}
section.near{margin-top:16px}
.near h2{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin:4px 4px 12px}
.near h2 img{height:46px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
@media (max-width:400px){.cats{grid-template-columns:1fr}}
.cat h3{margin:0 0 8px;font-size:16px;font-weight:900}
.cat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cat li{padding:8px 0;border-top:1.5px dashed var(--line)}
.cat li:first-child{border-top:0}
.cat .nm{font-weight:900;font-size:14.5px}
.cat .hr{display:inline-block;font-size:11.5px;font-weight:700;background:var(--chip);color:var(--ink2);border-radius:999px;padding:0 8px;margin-left:6px;vertical-align:1px}
.cat .hr.h24{background:var(--night);color:#fff}
.cat .ds{font-size:12.5px;color:var(--ink2);margin-top:2px}
.cat .nt{font-size:12.5px;color:var(--ink);margin-top:2px}
.cat .jp{display:block;font-size:12px;font-weight:500;color:var(--ink2)}
.cat .nm .hr{margin-left:0;margin-top:2px}
.cat ul.fl{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column;gap:3px}
.cat ul.fl li{border:0;padding:3px 9px;background:var(--chip);border-radius:8px;font-size:13px}
.vck{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap;margin-left:auto;padding:4px 0 4px 8px;min-height:32px}
.vck input,.ck input{width:20px;height:20px;accent-color:var(--walked);margin:0;cursor:pointer}
.stop .top{flex-wrap:nowrap}
.stop.visited{border-color:#9ED9B4;background:#F3FBF6}
.stop.visited .n::after{content:" ✓";color:#2E9A5A}
.cat li.visited .nm{color:#2E9A5A}
.cat .nmrow{display:flex;align-items:flex-start;gap:6px}
.pin .vb{font-size:18px;font-weight:900;fill:#2E9A5A;stroke:#fff;stroke-width:4px;paint-order:stroke;display:none}
.pin.visited .vb{display:inline}
.pin.visited circle.dot{stroke:#2E9A5A}
.checklist{margin-top:16px}
.ckhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ckhead h2{margin:0;font-size:20px;font-weight:900}
.ckhead #ckCount{font-weight:900;color:var(--walked)}
.ckhead .btn{margin-left:auto}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.ckg h3{font-size:15px;margin:12px 0 6px}
.ckg ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:700;min-height:48px}
.ck.on{background:#F3FBF6;border-color:#9ED9B4;color:#2E7A4C;text-decoration:line-through}
.ckg .tip{font-size:12.5px;color:var(--ink2);margin:8px 2px 0}
.ckg .shops{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px}
.ckg .shop{background:var(--chip);border-radius:12px;padding:8px 10px;font-size:13px}

.esim{margin:4px 0 8px;padding:10px 14px}

.ef{margin-top:8px}.ef label{display:block;font-size:13px;font-weight:700;margin-bottom:3px}
.ef .row{display:flex;gap:8px}
.ef input{flex:1;min-width:0;font:inherit;font-size:15px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink)}
.offline{align-self:center;font-size:13px;font-weight:700;background:#5B4BC4;color:#fff;border-radius:999px;padding:4px 12px}
.mapwrap{position:relative}
.mebtn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);box-shadow:0 2px 0 var(--line)}
.mebtn[aria-pressed="false"]{background:rgba(255,255,255,.92);color:var(--ink);border-color:var(--line)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;max-width:92vw;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.pin.now .ring{animation:none}}
</style>
</head>

<div class="wrap">
  <header class="hero" role="img" aria-label="三麗鷗主題橫幅">
    <div class="tag"><h1>大阪散步帖 ✿ 我的 6 天</h1><span class="sub">2026/10/29（四）– 11/03（二）・東横INN大阪なんば</span></div>

    <span class="offline" id="offlineTag" hidden>📴 離線模式・顯示已存好的版本</span>
  </div>

  <details class="card esim" id="esim">
    <summary>📶 我的 eSIM（只存在這支手機）</summary>

    <div class="ef"><label for="esimNote">備註（方案、客服、到期日）</label><div class="row"><input id="esimNote" autocomplete="off"><button class="btn sm" type="button" data-copy="esimNote">複製</button></div></div>

        <div class="controls">

          <button class="btn" id="speedBtn" type="button" aria-label="播放速度">×1</button>
        </div>
        <div class="status" aria-live="polite"><img id="leaderImg" alt=""><span id="status"></span></div>
        <p class="note">地圖是示意圖、不是實際比例（遠的路段有壓縮，旁邊標公里數）。實際位置請點每站的「地圖」。</p>
      </section>
      <section class="card" aria-label="當日行程">
        <ol class="stops" id="stops"></ol>
      </section>
    </div>
    <section class="card checklist" aria-labelledby="ckTitle">
      <div class="ckhead"><h2 id="ckTitle">✅ 今天要帶・要做</h2><span id="ckCount"></span><button class="btn sm" id="ckReset" type="button">全部重設</button></div>
      <div id="ckBody"></div>
    </section>
  </div>

  <section class="near" id="near" aria-labelledby="nearTitle">
    <h2 id="nearTitle"></h2>
    <div class="cats" id="cats"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

/* 版面：真實經緯度 → 壓縮距離的示意座標，並把點推開 */
function layout(d){
  d.stops.forEach(s=>s.m=toMin(s.t));
  const nodes=new Map();
  d.stops.forEach(s=>{const k=s.ll.join(",");if(!nodes.has(k))nodes.set(k,{ll:s.ll,stops:[],label:s.s,icon:s.i});s.node=nodes.get(k);s.node.stops.push(s)});
  const N=[...nodes.values()];
  const lat0=N.reduce((a,n)=>a+n.ll[0],0)/N.length, lon0=N.reduce((a,n)=>a+n.ll[1],0)/N.length, c=Math.cos(lat0*Math.PI/180);
  N.forEach(n=>{const x=(n.ll[1]-lon0)*c*111, y=-(n.ll[0]-lat0)*111, r=Math.hypot(x,y), r2=r?Math.pow(r,.22):0; n.x=r?x/r*r2:0; n.y=r?y/r*r2:0});
  const fit=()=>{const xs=N.map(n=>n.x),ys=N.map(n=>n.y);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const TOP=100, sc=Math.min((W-PAD*2)/((x1-x0)||1),(H-PAD*2-TOP)/((y1-y0)||1)), ox=(W-(x1-x0)*sc)/2, oy=(H-(y1-y0)*sc)/2+TOP/2;
    N.forEach(n=>{n.x=N.length>1?ox+(n.x-x0)*sc:W/2; n.y=N.length>1?oy+(n.y-y0)*sc:H/2})};
  fit();
  const MIN=Math.min(190,.95*Math.sqrt((W-PAD*2)*(H-PAD*2)/N.length));
  for(let round=0;round<6;round++){
    for(let it=0;it<220;it++){for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const a=N[i],b=N[j];let dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy);
      if(dd<.01){dx=Math.cos(i+j);dy=Math.sin(i+j);dd=1}
      if(dd<MIN){const p=(MIN-dd)/2*.5;dx/=dd;dy/=dd;a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p}}}
    fit();
  }
  d._nodes=N;
  d._segs=d.stops.map((s,i)=>{if(!i)return null;const a=d.stops[i-1].node,b=s.node;if(a===b)return null;
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,sg=i%2?1:-1;return{a,b,c:{x:mx-dy*.16*sg,y:my+dx*.16*sg}}});
  placeLabels(d);
  d._start=d.stops[0].m-20; d._end=d.stops[d.stops.length-1].m+40;
}
/* 標籤：試下、右、左、上四個位置，挑跟其他點/標籤重疊最少的 */
const textW=s=>[...s].reduce((a,ch)=>a+(/[\x00-\x7F]/.test(ch)?.6:1.02),0)*FS;
function placeLabels(d){
  const boxes=d._nodes.map(n=>({x0:n.x-PIN-4,y0:n.y-PIN-4,x1:n.x+PIN+4,y1:n.y+PIN+4}));
  const segBoxes=[];
  const ov=(a,b)=>Math.max(0,Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0))*Math.max(0,Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0));
  d._segs.forEach((g,i)=>{if(!g)return;const s=d.stops[i];if(!s.km)return;const txt=`${s.mode||""} ${s.km}km`.trim(),w=textW(txt)*19/FS;
    let best=null,bs=1e18;
    [.5,.38,.62,.28,.72].forEach((t,k)=>{const mp=bez(g,t),b={x0:mp.x-w/2-4,y0:mp.y-16,x1:mp.x+w/2+4,y1:mp.y+10};
      let sc=k*20;segBoxes.forEach(o=>sc+=ov(b,o)*5);boxes.forEach(o=>sc+=ov(b,o)*5);
      if(b.x0<4||b.x1>W-4)sc+=4e4;if(sc<bs){bs=sc;best={mp,b}}});
    g.lbl={x:best.mp.x,y:best.mp.y+6,txt};segBoxes.push(best.b)});
  const placed=[...segBoxes];
  d._nodes.forEach((n,ni)=>{
    const w=textW(n.label),h=FS+4;
    const cands=[
      {x:n.x,y:n.y+PIN+FS+4,a:"middle",b:{x0:n.x-w/2,y0:n.y+PIN+4,x1:n.x+w/2,y1:n.y+PIN+4+h}},
      {x:n.x+PIN+8,y:n.y+8,a:"start",b:{x0:n.x+PIN+8,y0:n.y-h/2,x1:n.x+PIN+8+w,y1:n.y+h/2}},
      {x:n.x-PIN-8,y:n.y+8,a:"end",b:{x0:n.x-PIN-8-w,y0:n.y-h/2,x1:n.x-PIN-8,y1:n.y+h/2}},
      {x:n.x,y:n.y-PIN-10,a:"middle",b:{x0:n.x-w/2,y0:n.y-PIN-10-h+4,x1:n.x+w/2,y1:n.y-PIN-6}}];
    let best=null,bs=1e18;
    cands.forEach((c,k)=>{let sc=k*30;
      boxes.forEach((b,bi)=>{if(bi!==ni)sc+=ov(c.b,b)*4});placed.forEach(b=>sc+=ov(c.b,b)*4);
      if(c.b.x0<6||c.b.x1>W-6||c.b.y0<6||c.b.y1>H-6)sc+=5e4;
      if(sc<bs){bs=sc;best=c}});
    n.lbl=best;placed.push(best.b);
  });
}
const bez=(g,t)=>{const u=1-t;return{x:u*u*g.a.x+2*u*t*g.c.x+t*t*g.b.x,y:u*u*g.a.y+2*u*t*g.c.y+t*t*g.b.y}};
function stateAt(d,m){
  const S=d.stops;
  if(m<=S[0].m)return{p:S[0].node,idx:0,moving:false};
  for(let i=0;i<S.length-1;i++){const b=S[i+1];
    if(m<b.m){const g=d._segs[i+1];if(!g)return{p:S[i].node,idx:i,moving:false};
      const gap=b.m-S[i].m,tr=Math.min(b.tr||Math.min(30,gap),gap),dep=b.m-tr;
      if(m<dep)return{p:S[i].node,idx:i,moving:false};
      const f=(m-dep)/tr,e=f<.5?2*f*f:1-((-2*f+2)**2)/2;return{p:bez(g,e),idx:i,moving:true,next:i+1,f:e}}}
  return{p:S[S.length-1].node,idx:S.length-1,moving:false};
}

    return `<li class="${VISITED[vid]?"visited":""}" data-vid="${esc(vid)}"><div class="nmrow"><div class="nm">${zh?esc(zh)+(/[\u3040-\u30fa\u30fc-\u30ff]/.test(n)?`<span class="jp">${esc(n)}</span>`:""):esc(n)}${h?`<span class="hr${is24?" h24":""}">${is24?"🌙 24h":esc(h)}</span>`:""}</div><label class="vck"><input type="checkbox" ${VISITED[vid]?"checked":""}>去過</label></div>${lines.length>1?`<ul class="fl">${lines.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:lines.length?`<div class="nt">${esc(lines[0])}</div>`:""}<div class="ds">${esc(a)}　<a class="mlink" href="${link}" target="_blank" rel="noopener">地圖 ↗</a></div></li>`}).join("")}</ul></div>`).join("");
  $("cats").querySelectorAll("li[data-vid] .vck input").forEach(cb=>cb.onchange=()=>{const li=cb.closest("li");const id=li.dataset.vid;
    if(cb.checked)VISITED[id]=1;else delete VISITED[id];saveV();li.classList.toggle("visited",cb.checked)});
}
function refreshVisited(){const d=DAYS[dayIdx];pinEls.forEach(({n,g})=>g.classList.toggle("visited",n.stops.some(st=>VISITED[`d${dayIdx}-s${d.stops.indexOf(st)}`])))}
function renderChecklist(i){
  const groups=CHECKS[i]||[];
  $("ckBody").innerHTML=groups.map((g,gi)=>`<div class="ckg">${g.t?`<h3>${esc(g.t)}</h3>`:""}<ul>${g.items.map((t,k)=>{const id=`d${i}-g${gi}-${k}`;
    return `<li><label class="ck${CHECKED[id]?" on":""}"><input type="checkbox" data-id="${id}" ${CHECKED[id]?"checked":""}>${esc(t)}</label></li>`}).join("")}</ul>
    ${g.shops?`<div class="shops">${g.shops.map(([n,a,h,nt])=>`<div class="shop"><b>${esc(n)}</b>${esc(h)}${nt?"・"+esc(nt):""}<br>${esc(a)}　<a class="mlink" href="${G(n.replace(/（.*?）/g,"")+" "+a)}" target="_blank" rel="noopener">地圖 ↗</a></div>`).join("")}</div>`:""}
    ${g.tip?`<p class="tip">💡 ${esc(g.tip)}</p>`:""}</div>`).join("");
  const count=()=>{const all=$("ckBody").querySelectorAll("input"),on=[...all].filter(x=>x.checked).length;$("ckCount").textContent=`${on} / ${all.length}`};
  $("ckBody").querySelectorAll("input").forEach(cb=>cb.onchange=()=>{if(cb.checked)CHECKED[cb.dataset.id]=1;else delete CHECKED[cb.dataset.id];saveC();cb.closest(".ck").classList.toggle("on",cb.checked);count()});
  $("ckReset").onclick=()=>{Object.keys(CHECKED).forEach(k=>{if(k.startsWith(`d${i}-`))delete CHECKED[k]});saveC();renderChecklist(i)};
  count();
}
function renderMap(d){
  const svg=$("map");svg.innerHTML="";svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const bg=el("g",{"aria-hidden":"true"},svg);
  el("path",{d:`M-20 ${H*.8} C ${W*.18} ${H*.72}, ${W*.26} ${H*.93}, ${W*.46} ${H*.85} S ${W*.82} ${H*.72}, ${W+20} ${H*.82} L${W+20} ${H+20} L-20 ${H+20}Z`,fill:"var(--water)",opacity:".7"},bg);
  [[.15,.2,95],[.86,.18,80],[.82,.7,70],[.12,.62,60],[.5,.48,140]].forEach(([x,y,r],k)=>el("circle",{cx:x*W,cy:y*H,r,fill:k%2?"var(--soft)":"var(--chip)",opacity:".8"},bg));
  for(let k=0;k<26;k++){el("text",{x:(k*137)%W,y:(k*89)%(H-20)+14,"font-size":14,fill:"var(--accent)",opacity:".22"},bg).textContent=k%3?"✦":"♡"}
  segEls=[];
  const gs=el("g",{},svg),gl=el("g",{},svg);
  d._segs.forEach((g,i)=>{if(!g){segEls.push(null);return}
    const dstr=`M${g.a.x} ${g.a.y} Q${g.c.x} ${g.c.y} ${g.b.x} ${g.b.y}`;
    el("path",{d:dstr,class:"seg-base"},gs);const w=el("path",{d:dstr,class:"seg-walk"},gs);const len=w.getTotalLength();
    w.style.strokeDasharray=`0 ${len}`;segEls.push({w,len,i});
    if(g.lbl)el("text",{x:g.lbl.x,y:g.lbl.y,"text-anchor":"middle",class:"seg-lbl"},gl).textContent=g.lbl.txt;
  });
  pinEls=[];
  const gp=el("g",{},svg),gt=el("g",{},svg);
  d._nodes.forEach(n=>{
    const g=el("g",{class:"pin",transform:`translate(${n.x},${n.y})`},gp);
    el("circle",{class:"ring",r:PIN,fill:"var(--accent)",opacity:0},g);
    el("circle",{class:"dot",r:PIN},g);
    el("text",{class:"emo","text-anchor":"middle",y:8},g).textContent=n.icon;
    el("text",{class:"vb",x:PIN-4,y:-PIN+8},g).textContent="✓";
    el("text",{class:"lbl",x:n.lbl.x,y:n.lbl.y,"text-anchor":n.lbl.a},gt).textContent=n.label;
    pinEls.push({n,g});
  });
  const u=el("g",{},svg);
  const hm=PAL*1.15, wm=hm*ME_RATIO, wc=PAL*1.0;
  if(SHOW_ME){const x0=-(wm+wc-8)/2;
    el("image",{href:meURI(dayIdx),x:x0,y:-hm,width:wm,height:hm,preserveAspectRatio:"xMidYMax meet"},u);
    el("image",{href:`img/${DAY_PALS[dayIdx]}.png`,x:x0+wm-8,y:-wc,width:wc,height:wc,preserveAspectRatio:"xMidYMax meet"},u);
  }else{
    el("image",{href:`img/${DAY_PALS[dayIdx]}.png`,x:-wc/2,y:-wc,width:wc,height:wc,preserveAspectRatio:"xMidYMax meet"},u);
  }
  palEl=u;
}
function renderList(d){
  const ol=$("stops");ol.innerHTML="";
  d.stops.forEach((s,i)=>{const li=document.createElement("li");li.className="stop";li.dataset.i=i;
    const link=s.map||(s.q?G(s.q+(s.addr?" "+s.addr:"")):(s.addr?G(s.addr):null));
    const vid=`d${dayIdx}-s${i}`;li.dataset.vid=vid;li.classList.toggle("visited",!!VISITED[vid]);
    li.innerHTML=`<div class="top"><span class="t">${s.t}</span><span class="n">${s.i} ${s.n}</span><label class="vck"><input type="checkbox" ${VISITED[vid]?"checked":""} aria-label="已去過">去過</label></div>`+
      (s.go?`<div class="go">🚶 ${s.go}</div>`:"")+
      ((s.addr||link||s.note)?`<div class="meta">${s.addr?s.addr+"　":""}${link?`<a class="mlink" href="${link}" target="_blank" rel="noopener">地圖 ↗</a>`:""}${s.note?`<br>💡 ${s.note}`:""}</div>`:"");
    li.querySelector(".vck input").onchange=e=>{if(e.target.checked)VISITED[vid]=1;else delete VISITED[vid];saveV();li.classList.toggle("visited",e.target.checked);refreshVisited()};
    li.onclick=e=>{if(e.target.closest("a")||e.target.closest(".vck"))return;setLive(false);pause();cur=s.m;update()};
    ol.appendChild(li)});
}
function update(now=performance.now()){
  if(hotelMode)return;
  const d=DAYS[dayIdx];cur=Math.max(d._start,Math.min(d._end,cur));
  $("clock").textContent=fmt(cur);$("slider").value=cur;
  const st=stateAt(d,cur),S=d.stops;
  let msg;if(cur<S[0].m)msg=`準備出發：${S[0].n}`;else if(st.moving)msg=`🐾 前往 ${S[st.next].s}${S[st.next].mode?`（${S[st.next].mode}）`:""}`;else msg=`${S[st.idx].i} ${S[st.idx].n}`;
  if(cur>=d._end-1)msg+="・今天辛苦了！";
  $("status").textContent=msg;
  document.querySelectorAll(".stop").forEach(li=>{const i=+li.dataset.i,s=S[i];const isNow=!st.moving&&cur>=S[0].m&&i===st.idx;li.classList.toggle("now",isNow);li.classList.toggle("done",!isNow&&s.m<=cur&&i<=st.idx)});
  const nowNode=!st.moving&&cur>=S[0].m?S[st.idx].node:null;
  pinEls.forEach(({n,g})=>{g.classList.toggle("now",n===nowNode);g.classList.toggle("done",n!==nowNode&&n.stops.some(s=>s.m<=cur))});
  segEls.forEach(p=>{if(!p)return;let f=0;if(st.idx>=p.i)f=1;else if(st.moving&&st.next===p.i)f=st.f;p.w.style.strokeDasharray=f>0?`${p.len*f} ${p.len}`:`0 ${p.len}`;p.w.style.opacity=f>0?.95:0});
  if(palEl){const s2=stateAt(d,cur-.6);let bob=0;
    if(!reduced)bob=st.moving?-Math.abs(Math.sin(now/120))*7:Math.sin(now/450)*2;
    const dir=st.moving&&(st.p.x-s2.p.x)<-.05?-1:1;
    palEl.setAttribute("transform",`translate(${st.p.x.toFixed(1)},${(st.p.y-PIN+6+bob).toFixed(1)}) scale(${dir},1)`)}
}
function loop(ts){if(!lastTs)lastTs=ts;const dt=Math.min(100,ts-lastTs);lastTs=ts;
  if(playing&&!hotelMode){cur+=dt/1000*12*speed;if(cur>=DAYS[dayIdx]._end){cur=DAYS[dayIdx]._end;pause()}}
  update(ts);requestAnimationFrame(loop)}
function play(){const d=DAYS[dayIdx];if(cur>=d._end)cur=d._start;playing=true;$("playBtn").textContent="❚❚";$("playBtn").setAttribute("aria-label","暫停")}
function pause(){playing=false;$("playBtn").textContent="▶";$("playBtn").setAttribute("aria-label","播放")}
$("playBtn").onclick=()=>{setLive(false);playing?pause():play()};
$("slider").oninput=e=>{setLive(false);pause();cur=+e.target.value;update()};
$("speedBtn").onclick=()=>{speed=speed===1?2:speed===2?4:1;$("speedBtn").textContent="×"+speed};

function tokyoNow(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;return{date:`${g("year")}-${g("month")}-${g("day")}`,min:(+g("hour")%24)*60+ +g("minute")}}
let liveTimer=null,toastT;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),3600)}
function setLive(on){live=on;$("liveBtn").setAttribute("aria-pressed",on?"true":"false");clearInterval(liveTimer);
  if(!on)return;const n=tokyoNow(),i=DAYS.findIndex(d=>d.date===n.date);
  if(i<0){live=false;$("liveBtn").setAttribute("aria-pressed","false");toast(`現在日本時間 ${n.date.slice(5).replace("-","/")} ${fmt(n.min)}，旅程期間（10/29–11/03）才會即時對照，先按 ▶ 看模擬吧`);return}
  selectDay(i,true);const tick=()=>{cur=tokyoNow().min;update()};tick();liveTimer=setInterval(tick,15000);toast(`已對照日本時間 ${fmt(cur)}`)}
$("liveBtn").onclick=()=>setLive(!live);
$("meBtn").onclick=()=>{SHOW_ME=!SHOW_ME;store.set("osaka-showme",SHOW_ME);syncMeBtn();if(!hotelMode){renderMap(DAYS[dayIdx]);refreshVisited();update()}};
syncMeBtn();

function setTheme(t){document.documentElement.dataset.theme=t;$("themeBtn").textContent=t==="lilac"?"切換粉紅花朵版":"切換紫色格子版";try{localStorage.setItem("osaka-theme",t)}catch(e){}}
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="lilac"?"pink":"lilac");
try{const t=localStorage.getItem("osaka-theme");if(t)setTheme(t)}catch(e){}

/* eSIM：只存在本機 */
["esimAddr","esimCode","esimNote"].forEach(id=>{const inp=$(id);inp.value=store.get("osaka-"+id,"");inp.oninput=()=>store.set("osaka-"+id,inp.value)});
document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const v=$(b.dataset.copy).value;if(!v){toast("還沒有填");return}
  try{await navigator.clipboard.writeText(v);toast("已複製")}catch(e){const t=$(b.dataset.copy);t.select();document.execCommand("copy");toast("已複製")}});
/* 離線：用 service worker 把頁面和圖片存在手機裡（要放到 https 網址才會啟用） */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
const netTag=()=>{$("offlineTag").hidden=navigator.onLine};addEventListener("online",netTag);addEventListener("offline",netTag);netTag();
DAYS.forEach(layout);renderTabs();
const today=tokyoNow().date,ti=DAYS.findIndex(d=>d.date===today);
selectDay(ti<0?0:ti);
requestAnimationFrame(loop);
</script>
